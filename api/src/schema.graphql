scalar DateTime
scalar JSON

enum Medium {
  BOOK
  MANGA
  MOVIE
  SHOW
}

enum Status {
  Completed
  Ongoing
  Paused
}

type Entry {
  id: ID!
  alternateTitles: [String!]!
  comments: String
  coverImageUrl: String
  createdAt: DateTime!
  description: String
  franchise: Franchise
  genres: [String!]!
  medium: Medium!
  metadata: JSON!
  primaryTitle: String!
  referenceUrl: String
  staff: [String!]!
  status: Status
  tags: [String!]!
  updatedAt: DateTime!
}

type Franchise {
  id: ID!
  primaryTitle: String!
  primaryEntryId: ID
  entries: [Entry!]!
}

type FilterOptions {
  genres: [String!]!
  tags: [String!]!
}

type DeleteFranchiseResult {
  deletedFranchiseId: ID!
  deletedEntryCount: Int!
}

input CreateEntryInput {
  alternateTitles: [String!]
  comments: String
  coverImageUrl: String
  description: String
  franchiseId: ID
  genres: [String!]
  medium: Medium!
  metadata: JSON
  newFranchiseName: String
  primaryTitle: String!
  referenceUrl: String
  staff: [String!]
  status: Status
  tags: [String!]
}

input CreateFranchiseInput {
  primaryTitle: String!
}

input UpdateEntryInput {
  alternateTitles: [String!]
  comments: String
  coverImageUrl: String
  description: String
  genres: [String!]
  medium: Medium
  metadata: JSON
  primaryTitle: String
  referenceUrl: String
  staff: [String!]
  status: Status
  tags: [String!]
}

input UpdateFranchiseInput {
  primaryTitle: String!
}

type Me {
  isAdmin: Boolean!
}

type Query {
  entries: [Entry!]!
  entry(id: ID!): Entry
  franchise(id: ID!): Franchise
  availableFilterOptions: FilterOptions!
  franchises(
    search: String
    genres: [String!]
    tags: [String!]
    status: String
    medium: Medium
  ): [Franchise!]!
  me: Me!
}

"""
All mutations require a valid admin session cookie.
"""
type Mutation {
  createEntry(input: CreateEntryInput!): Entry!
  deleteEntry(id: ID!): Boolean!
  updateEntry(id: ID!, input: UpdateEntryInput!): Entry!
  createFranchise(input: CreateFranchiseInput!): Franchise!
  """
  Deletes the franchise and cascade-deletes all associated entries.
  """
  deleteFranchise(id: ID!): DeleteFranchiseResult!
  updateFranchise(id: ID!, input: UpdateFranchiseInput!): Franchise!
}
