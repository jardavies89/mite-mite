mutation CreateEntry($input: CreateEntryInput!) {
  createEntry(input: $input) {
    alternateTitles
    comments
    coverImageUrl
    createdAt
    description
    franchise {
      id
      primaryTitle
    }
    genres
    id
    medium
    metadata
    primaryTitle
    referenceUrl
    staff
    status
    tags
    updatedAt
  }
}
